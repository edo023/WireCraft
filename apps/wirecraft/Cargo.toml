[package]
name = "wirecraft"
description = "WireCraft: CAD elettrico per l'automazione industriale, basato su CADCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
elettrico = { workspace = true }
cadcraft-engine = { workspace = true }
cadcraft-ui-egui = { workspace = true }
cadcraft-io = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links", "persistence"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
sys-locale = "0.3"

[build-dependencies]
winresource = "0.1"
